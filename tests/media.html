<!doctype html><html lang="es"><meta charset="utf-8"><title>Nheu · Pruebas Img y ZipFusion</title><style>body{font:15px system-ui;padding:24px;color:#202d49;background:#f5f7fb}li{padding:6px}.pass{color:#187452}.fail{color:#c02b49}</style><h1>Pruebas Img y ZipFusion</h1><button id="start">Ejecutar pruebas</button><p id="summary"></p><ol id="results"></ol><script src="../vendor/jszip.min.js"></script><script src="../vendor/zip-full.min.js"></script><script src="../vendor/piexif.js"></script><script src="../vendor/html2canvas.min.js"></script><script type="module">
import {executeImage,loadImage,readMetadata} from '../js/image-engine.js';
import {executeZip} from '../js/zip-engine.js';
const assert=(v,m)=>{if(!v)throw new Error(m);};
const asFile=r=>new File([r.blob],r.name,{type:r.blob.type});
const canvas=document.createElement('canvas');canvas.width=100;canvas.height=60;const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,100,60);ctx.fillStyle='red';ctx.fillRect(20,10,40,40);
const png=new File([await new Promise(r=>canvas.toBlob(r))],'foto.png',{type:'image/png'});
const jpg=new File([await new Promise(r=>canvas.toBlob(r,'image/jpeg'))],'foto.jpg',{type:'image/jpeg'});
const txt=new File(['contenido de prueba'],'prueba.txt');
document.querySelector('#start').onclick=async()=>{
 let passed=0,failed=0;document.querySelector('#start').disabled=true;document.querySelector('#results').replaceChildren();
 async function check(name,fn){const li=document.createElement('li');try{await fn();li.className='pass';li.textContent='✓ '+name;passed++;}catch(e){li.className='fail';li.textContent='✕ '+name+': '+e.message;failed++;}document.querySelector('#results').append(li);document.querySelector('#summary').textContent=`${passed} correctas · ${failed} fallidas`;}
 for(const [id,o,w,h] of [ ['img-resize',{resizeMode:'percent',size:50},50,30],['img-crop',{x:20,y:0,width:50,height:50},50,30],['img-upscale',{scale:2},200,120],['img-rotate',{rotation:90},60,100],['img-jpg',{},100,60],['img-convert',{format:'webp'},100,60],['img-edit',{text:'Hola'},100,60],['img-watermark',{text:'Nheu'},100,60],['img-meme',{top:'Hola',bottom:'Mundo'},100,60],['img-pixelate',{x:0,y:0,width:50,height:50},100,60]])await check(id,async()=>{const out=await executeImage(id,[png],o);const im=await loadImage(asFile(out));assert(im.naturalWidth===w&&im.naturalHeight===h,'Dimensiones incorrectas');});
 await check('Fondo blanco eliminado, objeto rojo conservado',async()=>{const out=await executeImage('img-background',[png],{background:'#ffffff',tolerance:20});const im=await loadImage(asFile(out));ctx.clearRect(0,0,100,60);ctx.drawImage(im,0,0);assert(ctx.getImageData(0,0,1,1).data[3]===0,'No elimina el fondo');assert(ctx.getImageData(30,20,1,1).data[3]===255,'Elimina el objeto');});
 await check('Compresión no aumenta el tamaño',async()=>{const r=await executeImage('img-compress',[jpg],{quality:50,format:'jpeg'});assert(r.blob.size<=jpg.size,'Aumenta el tamaño');});
 await check('Metadatos EXIF se escriben, leen y eliminan',async()=>{const r=await executeImage('img-metadata',[jpg],{author:'Jaume',description:'Prueba',copyright:'Nheu',date:'2026:11:17 10:30:00'});const m=await readMetadata(asFile(r));assert(m.author==='Jaume'&&m.date==='2026:11:17 10:30:00','No guarda EXIF');const clean=await executeImage('img-clean',[asFile(r)],{});assert(!(await readMetadata(asFile(clean))).author,'Conserva EXIF');const original=await loadImage(jpg),cleaned=await loadImage(asFile(clean));const c=document.createElement('canvas');c.width=100;c.height=60;const x=c.getContext('2d');x.drawImage(original,0,0);const before=x.getImageData(0,0,100,60).data;x.drawImage(cleaned,0,0);assert(before.every((v,i)=>v===x.getImageData(0,0,100,60).data[i]),'Ha recomprimido JPEG');});
 await check('GIF animado y GIF fijo válidos',async()=>{for(const [id,files,o] of [['img-gif',[png,jpg],{gifWidth:100,delay:100}],['img-convert',[png],{format:'gif'}]]){const r=await executeImage(id,files,o);assert(new TextDecoder().decode(await r.blob.slice(0,6).arrayBuffer())==='GIF89a','Cabecera GIF inválida');assert((await loadImage(asFile(r))).naturalWidth===100,'GIF ilegible');}});
 await check('Lote contiene dos imágenes',async()=>{const r=await executeImage('img-jpg',[png,png],{}),z=await JSZip.loadAsync(await r.blob.arrayBuffer());assert(Object.keys(z.files).length===2,'Falta un archivo');});
 await check('HTML local se renderiza sin ejecutar scripts',async()=>{const f=new File(['<h1 style="color: red">Hola</h1><script>document.title="injected"<\/script><p>Prueba</p>'],'prueba.html');const r=await executeImage('img-html',[f],{htmlWidth:400});assert((await loadImage(asFile(r))).naturalWidth===400,'Ancho incorrecto');assert(document.title!=='injected','Se ejecutó un script');});
 await check('ZIP normal y fusionado recuperan el contenido',async()=>{for(const password of ['', 'clave-prueba']){const archive=await executeZip('zip-create',[txt],{password});const plain=await executeZip('zip-open',[asFile(archive)],{password});let z=await JSZip.loadAsync(await plain.blob.arrayBuffer());assert(await z.file('prueba.txt').async('string')==='contenido de prueba','No recupera ZIP');const fusion=await executeZip('zip-fuse',[png,txt],{password});assert((await loadImage(asFile(fusion))).naturalWidth===100,'Imagen fusionada inválida');const extracted=await executeZip('zip-extract',[asFile(fusion)],{password});z=await JSZip.loadAsync(await extracted.blob.arrayBuffer());assert(await z.file('prueba.txt').async('string')==='contenido de prueba','Fusión incorrecta');}});
 await check('Fusión de ZIP existente ajusta offsets',async()=>{const z=await executeZip('zip-create',[txt],{}),r=await executeZip('zip-fuse',[jpg,asFile(z)],{}),out=await executeZip('zip-extract',[asFile(r)],{});assert(await (await JSZip.loadAsync(await out.blob.arrayBuffer())).file('prueba.txt').async('string')==='contenido de prueba','ZIP dañado');});
 await check('Rechaza contraseña incorrecta',async()=>{const z=await executeZip('zip-create',[txt],{password:'correcta'});let rejected=false;try{await executeZip('zip-open',[asFile(z)],{password:'incorrecta'});}catch{rejected=true;}assert(rejected,'Aceptó contraseña incorrecta');});
 await check('Rechaza recorte fuera de límites',async()=>{let rejected=false;try{await executeImage('img-crop',[png],{x:90,y:0,width:50,height:50});}catch{rejected=true;}assert(rejected,'No valida el recorte');});
 document.querySelector('#start').disabled=false;
};
</script></html>
