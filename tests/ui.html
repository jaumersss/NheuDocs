<!doctype html><html lang="es"><meta charset="utf-8"><title>Nheu · Integración de interfaz</title><style>body{font:14px system-ui;padding:20px}iframe{width:390px;height:760px;border:1px solid #ddd}li{padding:8px}</style><h1>Interfaz móvil · integración</h1><button id="start">Comprobar interfaz</button><p id="summary"></p><ol id="results"></ol><iframe title="Nheu móvil" src="/?mode=img"></iframe><script type="module">
const frame=document.querySelector('iframe'),summary=document.querySelector('#summary');const assert=(v,m)=>{if(!v)throw Error(m);};
async function wait(fn){for(let i=0;i<100;i++){if(fn())return;await new Promise(r=>setTimeout(r,50));}throw Error('Tiempo de espera agotado');}
async function nav(url){frame.src=url;await new Promise(r=>frame.onload=r);await wait(()=>frame.contentDocument.querySelector('.tool-card')||frame.contentDocument.querySelector('#workspace-title')?.textContent);return frame.contentDocument;}
document.querySelector('#start').onclick=async()=>{let pass=0,fail=0;document.querySelector('#start').disabled=true;document.querySelector('#results').replaceChildren();async function check(label,fn){const li=document.createElement('li');try{await fn();li.textContent='✓ '+label;pass++;}catch(e){li.textContent='✕ '+label+': '+e.message;fail++;}document.querySelector('#results').append(li);summary.textContent=`${pass} correctas · ${fail} fallidas`;}
await check('Catálogos y navegación del selector',async()=>{for(const [mode,count] of [['docs',24],['img',17],['zip',4]]){const d=await nav('/?mode='+mode);assert(d.querySelectorAll('.tool-card').length===count,'Número incorrecto');assert(d.querySelector('[data-mode="'+mode+'"]').getAttribute('aria-current')==='page','Modo no marcado');assert(d.documentElement.scrollWidth<=400,'Desborda pantalla móvil');}});
await check('Buscar imágenes y limpiar búsqueda',async()=>{const d=await nav('/?mode=img'),s=d.querySelector('#search');s.value='metadatos';s.dispatchEvent(new Event('input'));assert(d.querySelectorAll('.tool-card').length===3,'Búsqueda incorrecta');s.value='inexistente';s.dispatchEvent(new Event('input'));assert(!d.querySelector('#empty').hidden,'No muestra vacío');d.querySelector('#clear-search').click();assert(d.querySelectorAll('.tool-card').length===17,'No restaura');});
await check('Carga, opciones, procesado y descarga',async()=>{const d=await nav('/?tool=img-resize'),win=frame.contentWindow,c=d.createElement('canvas');c.width=100;c.height=60;const file=new win.File([await new Promise(r=>c.toBlob(r))],'prueba.png',{type:'image/png'}),dt=new win.DataTransfer();dt.items.add(file);const input=d.querySelector('#file-input');input.files=dt.files;input.dispatchEvent(new Event('change'));await wait(()=>!d.querySelector('#run').disabled);d.querySelector('#options [name=size]').value='50';d.querySelector('#run').click();await wait(()=>!d.querySelector('#result').hidden||!d.querySelector('#error').hidden);assert(d.querySelector('#error').hidden,d.querySelector('#error').textContent);assert(d.querySelector('#download-result').download.endsWith('.png'),'Descarga incorrecta');assert(d.querySelector('.product-switch [data-mode=img]').classList.contains('active'),'Enlace directo no selecciona Img');assert(d.documentElement.scrollWidth<=400,'Desborda pantalla');});
await check('Tema oscuro mantiene amarillo',async()=>{const d=frame.contentDocument;d.querySelector('#theme').click();assert(d.documentElement.dataset.theme==='dark','No cambia tema');assert(frame.contentWindow.getComputedStyle(d.documentElement).getPropertyValue('--brand-yellow').trim()==='#f2c230','Color incorrecto');d.querySelector('#theme').click();});
await check('Cambios de producto y herramientas sin recargar, con Atrás/Adelante',async()=>{
 const d=await nav('/?mode=docs'),win=frame.contentWindow;let loads=0;const onload=()=>loads++;frame.addEventListener('load',onload);
 try{
  for(const [mode,count] of [['img',17],['zip',4],['docs',24],['zip',4]]){
   d.querySelector('[data-mode="'+mode+'"]').click();assert(frame.contentDocument===d,'Se recargó el documento');assert(d.documentElement.dataset.product===mode,'Producto incorrecto');assert(d.querySelectorAll('.tool-card').length===count,'Catálogo incorrecto');assert(d.querySelectorAll('[data-mode][aria-current=page]').length===1,'Selector no sincronizado');
  }
  d.querySelector('a[href="?tool=zip-fuse"]').click();assert(!d.querySelector('#workspace').hidden&&d.querySelectorAll('.fuse-box').length===2,'No abre fusión');
  d.querySelector('[data-mode=img]').click();assert(d.querySelector('#workspace').hidden,'No cierra herramienta');assert(!d.querySelector('.search').hidden,'No restaura búsqueda');
  win.history.back();await wait(()=>win.location.search==='?tool=zip-fuse'&&!d.querySelector('#workspace').hidden);assert(d.querySelectorAll('.fuse-box').length===2,'No restaura fusión');
  win.history.forward();await wait(()=>win.location.search==='?mode=img'&&d.querySelector('#workspace').hidden);
  d.querySelector('a[href="?tool=img-resize"]').click();assert(d.querySelector('#workspace-title').textContent==='Redimensionar imagen','No abre IMG');
  d.querySelector('#catalog-link').click();assert(d.querySelectorAll('.tool-card').length===17&&d.querySelector('#workspace').hidden,'No vuelve al catálogo');
  assert(frame.contentDocument===d&&loads===0,'Hubo una recarga de página');
 }finally{frame.removeEventListener('load',onload);}
});
document.querySelector('#start').disabled=false;};
</script></html>
