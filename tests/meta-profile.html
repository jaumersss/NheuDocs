<!doctype html><html lang="es"><meta charset="utf-8"><title>Pruebas del perfil Meta</title><style>body{font:15px system-ui;padding:24px}li{margin:12px 0}video{max-width:100%;width:380px}</style><h1>Perfil Meta · fotos y vídeo</h1><button id="start">Ejecutar pruebas</button><p id="summary"></p><ol id="results"></ol><script src="../vendor/jszip.min.js"></script><script src="../vendor/piexif.js"></script><script type="module">
import {executeImage,loadImage,dataURL} from '../js/image-engine.js';
import {parseBoxes} from '../js/meta-profile.js';
const assert=(v,m)=>{if(!v)throw Error(m);},asFile=r=>new File([r.blob],r.name,{type:r.blob.type});
document.querySelector('#start').onclick=async()=>{
 let pass=0,fail=0;document.querySelector('#start').disabled=true;document.querySelector('#results').replaceChildren();
 async function check(name,fn){const li=document.createElement('li');try{await fn();pass++;li.textContent='✓ '+name;}catch(e){fail++;li.textContent='✕ '+name+': '+e.message;}document.querySelector('#results').append(li);document.querySelector('#summary').textContent=`${pass} correctas · ${fail} fallidas`;}
 const c=document.createElement('canvas');c.width=120;c.height=80;c.getContext('2d').fillRect(0,0,120,80);const jpg=new File([await new Promise(r=>c.toBlob(r,'image/jpeg'))],'prueba.jpg');
 await check('JPEG: perfil EXIF y píxeles sin recomprimir',async()=>{const r=await executeImage('img-meta',[jpg],{framing:'original'}),out=asFile(r),exif=piexif.load(await dataURL(out));assert(exif['0th'][271]==='Meta AI','Fabricante incorrecto');assert(exif['0th'][272]==='Ray-Ban Meta Smart Glasses','Modelo incorrecto');assert(exif.Exif[37510].includes('app=Meta View&device='),'Falta comentario');const a=new Uint8Array(await jpg.arrayBuffer()),b=new Uint8Array(await out.arrayBuffer());const scan=x=>{for(let i=2;i<x.length-1;i++)if(x[i]===255&&x[i+1]===218)return x.slice(i);throw Error('Falta scan JPEG');};assert(scan(a).every((v,i)=>v===scan(b)[i])&&scan(a).length===scan(b).length,'Se han alterado los píxeles comprimidos');});
 await check('Encuadre vertical JPEG 3024 × 4032',async()=>{const r=await executeImage('img-meta',[jpg],{framing:'portrait'}),im=await loadImage(asFile(r));assert(im.naturalWidth===3024&&im.naturalHeight===4032,'Dimensiones incorrectas');});
 await check('Vídeo MP4: metadatos y reproducción conservados',async()=>{
  const response=await fetch('./output/meta-source.mp4');if(!response.ok)throw Error('Falta la muestra CC0 de MDN en tests/output/meta-source.mp4');const source=new File([await response.blob()],'muestra.mp4',{type:'video/mp4'}),result=await executeImage('img-meta',[source],{});
  const a=new Uint8Array(await source.arrayBuffer()),b=new Uint8Array(await result.blob.arrayBuffer());const am=parseBoxes(a).find(n=>n.type==='mdat'),bm=parseBoxes(b).find(n=>n.type==='mdat');assert(am.start===bm.start&&a.slice(am.start,am.end).every((v,i)=>v===b[bm.start+i]),'Vídeo recomprimido');
  async function inspect(blob){const v=document.createElement('video'),url=URL.createObjectURL(blob);v.controls=true;v.muted=true;v.src=url;document.body.append(v);try{await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Tiempo de carga agotado')),10000);v.onloadedmetadata=()=>{clearTimeout(timer);resolve();};v.onerror=()=>{clearTimeout(timer);reject(Error('No se reproduce'));};});const info=[v.videoWidth,v.videoHeight,v.duration];v.currentTime=1;await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('No puede avanzar')),10000);v.onseeked=()=>{clearTimeout(timer);resolve();};});return info;}finally{v.remove();URL.revokeObjectURL(url);}}
  const original=await inspect(source),tagged=await inspect(result.blob);assert(original.every((v,i)=>Math.abs(v-tagged[i])<.01),'Cambia duración o resolución');const video=document.createElement('video');video.src=URL.createObjectURL(result.blob);video.controls=true;document.body.append(video);
 });
 document.querySelector('#start').disabled=false;
};
</script></html>
