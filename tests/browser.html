<!doctype html><html lang="es"><meta charset="utf-8"><title>NheuDocs · Pruebas de conversión</title><style>body{font:15px system-ui;background:#f5f7fb;color:#202d49;padding:40px}li{padding:7px}.pass{color:#287264}.fail{color:#b21d38}button{padding:15px;border-radius:12px;border:1px solid #b8c4e0;cursor:pointer}</style><h1>Pruebas con documentos sintéticos</h1><p>No utiliza documentos personales ni envía archivos a terceros.</p><button id="start">Ejecutar pruebas del navegador</button><p id="summary"></p><ol id="results"></ol><script src="../vendor/pdf-lib.min.js"></script><script src="../vendor/jszip.min.js"></script><script type="module">
import {execute,extractTextPages,readPdf,openPreview,pageCanvas} from '../js/engine.js';
const assert=(value,message)=>{if(!value)throw new Error(message)};
const file=async path=>new File([await(await fetch(path)).blob()],path.split('/').pop(),{type:'application/pdf'});
document.querySelector('#start').onclick=async()=>{
 document.querySelector('#start').disabled=true;document.querySelector('#results').replaceChildren();let passed=0,failed=0;const alpha=await file('./output/alpha.pdf'),beta=await file('./output/beta.pdf');
 const pdfFile=result=>new File([result.blob],result.name,{type:'application/pdf'});
 const check=async(name,fn)=>{const li=document.createElement('li');li.textContent=name+' …';document.querySelector('#results').append(li);try{await fn();passed++;li.className='pass';li.textContent='✓ '+name;}catch(error){failed++;li.className='fail';li.textContent='✗ '+name+': '+error.message;console.error(name,error);}};
 await check('PDF a Word: DOCX abre y contiene texto y acentos',async()=>{const out=await execute('pdf-word',[alpha]);const zip=await JSZip.loadAsync(await out.blob.arrayBuffer());const xml=await zip.file('word/document.xml').async('string');assert(xml.includes('Documento alpha')&&xml.includes('café'),'Falta texto en el DOCX');});
 await check('PDF a Excel: celdas reales y tres hojas',async()=>{const out=await execute('pdf-excel',[alpha]);const wb=new ExcelJS.Workbook();await wb.xlsx.load(await out.blob.arrayBuffer());assert(wb.worksheets.length===3,'Número incorrecto de hojas');assert(wb.worksheets[0].getRow(1).getCell(1).text.includes('Documento alpha'),'Texto perdido');});
 await check('PDF a PowerPoint: PPTX con tres diapositivas e imágenes',async()=>{const out=await execute('pdf-ppt',[alpha]);const zip=await JSZip.loadAsync(await out.blob.arrayBuffer());assert(Object.keys(zip.files).filter(k=>/^ppt\/slides\/slide\d+\.xml$/.test(k)).length===3,'Faltan diapositivas');assert(Object.keys(zip.files).some(k=>k.startsWith('ppt/media/')),'Faltan imágenes');});
 await check('PDF a JPG: tres JPEG válidos en ZIP',async()=>{const out=await execute('pdf-jpg',[alpha]);const zip=await JSZip.loadAsync(await out.blob.arrayBuffer());assert(Object.keys(zip.files).length===3,'Faltan páginas');for(const entry of Object.values(zip.files)){const bytes=await entry.async('uint8array');assert(bytes[0]===255&&bytes[1]===216,'No es JPEG');}});
 await check('Imágenes a PDF: PNG a dos páginas A4',async()=>{const canvas=document.createElement('canvas');canvas.width=100;canvas.height=100;const ctx=canvas.getContext('2d');ctx.fillStyle='blue';ctx.fillRect(0,0,100,100);const blob=await new Promise(r=>canvas.toBlob(r));const image=new File([blob],'foto.png',{type:'image/png'});const out=await execute('jpg-pdf',[image,image],{orientation:'portrait',margin:'normal'});const doc=await readPdf(pdfFile(out));assert(doc.getPageCount()===2,'Faltan imágenes');});
 await check('PDF a Markdown: texto legible',async()=>{const out=await execute('markdown',[alpha]);assert((await out.blob.text()).includes('## Página 3'),'Falta página 3');});
 await check('Comparación: identifica cambios y genera HTML',async()=>{const out=await execute('compare',[alpha,beta]);assert((await out.blob.text()).includes('3 páginas con cambios'),'No detecta cambios');});
 await check('HTML a PDF: texto convertido sin ejecutar scripts',async()=>{const source=new File(['<h1>Título de prueba</h1><p>Contenido seguro</p><script>throw new Error("injected")<\/script>'],'ejemplo.html',{type:'text/html'});const out=await execute('html-pdf',[source]);const text=await extractTextPages(pdfFile(out));assert(text[0].text.includes('Contenido seguro')&&!text[0].text.includes('injected'),'HTML mal filtrado');});
 await check('Numeración: texto añadido y PDF legible',async()=>{const out=await execute('numbers',[alpha],{start:10});const text=await extractTextPages(pdfFile(out));assert(text[2].text.includes('12'),'Falta numeración');});
 await check('Editar: texto añadido recuperable',async()=>{const out=await execute('edit',[alpha],{text:'Añadido por NheuDocs',size:14,x:10,y:45});const text=await extractTextPages(pdfFile(out));assert(text[0].text.includes('Añadido por NheuDocs'),'No se añadió texto');});
 await check('Marca de agua: contenido presente',async()=>{const out=await execute('watermark',[alpha],{text:'BORRADOR',opacity:.2});const text=await extractTextPages(pdfFile(out));assert(text[0].text.includes('BORRADOR'),'Falta marca');});
 await check('Censura: no queda texto ni metadatos originales y zona negra',async()=>{const out=await execute('redact',[alpha],{x:0,y:0,width:100,height:25,pages:'1'});const text=await extractTextPages(pdfFile(out));assert(text.every(p=>!p.text.trim()),'Queda texto oculto');const preview=await openPreview(pdfFile(out));const canvas=await pageCanvas(preview,0,1);const pixel=canvas.getContext('2d').getImageData(100,100,1,1).data;assert(pixel[0]<10&&pixel[1]<10&&pixel[2]<10,'Zona sin censurar');await preview.destroy();});
 await check('Firma dibujada: imagen incrustada en el PDF',async()=>{const canvas=document.createElement('canvas');canvas.width=400;canvas.height=100;const ctx=canvas.getContext('2d');ctx.strokeStyle='black';ctx.beginPath();ctx.moveTo(10,70);ctx.lineTo(100,20);ctx.lineTo(230,70);ctx.stroke();const out=await execute('sign',[alpha],{signature:canvas.toDataURL(),x:50,y:75,pages:'1'});const doc=await readPdf(pdfFile(out));assert(doc.getPage(0).node.Resources().lookup(PDFLib.PDFName.of('XObject')).keys().length>0,'Falta firma');});
 await check('Compresión visual: salida válida sin aumentar tamaño',async()=>{const out=await execute('compress',[alpha],{quality:'small'});assert(out.blob.size<=alpha.size,'El resultado es mayor');assert((await readPdf(pdfFile(out))).getPageCount()===3,'Faltan páginas');});
 document.querySelector('#summary').textContent=`${passed} correctas · ${failed} fallidas`;document.querySelector('#start').disabled=false;
};
</script></html>
